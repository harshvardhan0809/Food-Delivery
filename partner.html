<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Partner With Eatzy</title>
    <link rel="icon" type="image/png" href="Favicon.png">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-image: url(https://plus.unsplash.com/premium_photo-1661295675442-f151fdf7ba52);
            background-size: cover;
            min-height: 100vh;
            padding: 20px;
        }

        .regis-form {
            background: white;
            padding: 30px;
            border-radius: 15px;
            max-width: 450px;
            margin: 50px auto;
        }

        h1 {
            color: brown;
            text-align: center;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: brown;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 18px;
            cursor: pointer;
        }

        button:hover {
            background: #a0592d;
        }

        a {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: brown;
        }
    </style>
</head>
<body>
    <div class="regis-form">
        <h1>Partner With Eatzy!</h1>
        
        <form id="partnerForm">
            <input type="text" placeholder="Your Name *" required>
            <input type="text" placeholder="Restaurant Name *" required>
            <input type="tel" placeholder="Phone Number *" required>
            <input type="email" placeholder="Email Address *" required>
            <button type="submit">Submit</button>
        </form>

        <a href="index.html">← Back to Home</a>
    </div>

    <script>
        document.getElementById('partnerForm').addEventListener('submit', function(e) {
            e.preventDefault();
            alert('Thank you! We will contact you soon.');
            this.reset();
        });
    </script>
</body>
</html>
