<!DOCTYPE html>
<html lang="en">
<head>
    <title>Eatzy - Food Delivered in a Tap</title>
    <link rel="icon" type="image/png" href="Favicon.png">
    <style>
      #main-heading {
    font-family: Helvetica;
    text-align: center;
    color: #ff0808;
    font-size: 48px;
}


#main-element {
    margin: auto;
    width: 420px;
    height: 390px;
    padding-left: 22px;
    padding-right: 22px;
    padding-top: 22px;
    padding-bottom: 22px;
    background-color: rgb(233,236,239);
}
input {
    width: 375px;
    border: 1px solid gray;
    padding-top: 18px;
    padding-bottom: 18px;
    padding-left: 21px;
    padding-right: 21px;
    font-size: 16px;
}


#submitbtn {
    width: 420px;
    height: 60px;
    background-color: #ff0808;
    border: none;
    color: white;
    margin-bottom: 15px;
    font-weight: bold;
    padding-left: 27px;
    padding-right: 27px;
    font-size: 18px;
}


#submitbtn:hover {
    opacity: 0.8;
}


#link {
    color: #ff7f08;
    text-decoration: none;
    font-size: 19px;
    font-weight: 500;
    padding-left: 130px;

}


#acc {
    width: 270px;
    height: 60px;
    display: block;
    background-color: #42b72a;
    font-weight: bold;
    color: white;
    border: none;
    margin-left: auto;
    margin-right: auto;
    font-size: 18px;
}

#link:hover {
    text-decoration: underline;
}

#acc:hover {
    background-color: #006606;
}


* {
    border-radius: 6px;
    font-family: Helvetica;
}
input {
    margin-bottom: 15px;
}
button:hover {
    cursor: pointer;
}
#hori {
    margin-top: 22px;
    margin-bottom: 22px;
    color: rgb(217,215,215);
}
    </style>
</head>
<body>
    <h1 id="main-heading">Eatzy</h1>
    <form id="main-element">
        <input type="email" placeholder="Email address or phone number">
        <input type="password" placeholder="Password">
        <button id="submitbtn" type="submit">Log in</button>
        <a id="link" href="#">Forgotten password?</a>
        <hr id="hori"> 
        <button id="acc">Create New Account</button>
    </form>
    
</body>
</html>
